<polygon points="120,612 129,608 129,616" fill="rgb(4,120,87)"/>
<text x="453.5" y="602" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13"><tspan fill="rgb(153,27,27)" font-weight="700">no match: stop</tspan></text>
<text x="28" y="718" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">ROM checks BL2, BL2 checks BL31, BL31 checks OP-TEE and Linux. Same <tspan fill="rgb(190,24,93)" font-weight="700">public key</tspan>. No CA.</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
<rect width="1240" height="720" fill="rgb(247,245,240)"/>
<text x="28" y="34" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" fill="rgb(31,41,51)">UFS: the same version check, stored in one RPMB region</text>
<rect x="16" y="52" width="360" height="648" rx="8" fill="rgb(255,255,255)" stroke="rgb(226,221,212)"/>
<text x="36" y="80" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" fill="rgb(31,41,51)" font-weight="700">UFS</text>
<rect x="36" y="96" width="320" height="56" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="130" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">Boot LUN A</text>
<rect x="36" y="160" width="320" height="56" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="194" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">Boot LUN B</text>
<rect x="36" y="224" width="320" height="200" rx="6" fill="rgb(255,237,213)" stroke="rgb(194,65,12)" stroke-width="1.8"/>
<text x="196" y="268" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle" font-weight="700">RPMB well-known logical unit</text>
<text x="196" y="300" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle">KVN</text>
<text x="196" y="326" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle">min SVN</text>
<text x="196" y="360" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(194,65,12)" text-anchor="middle">JESD220 identifier 0xC4</text>
<rect x="36" y="440" width="320" height="232" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="548" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">User logical units</text>
<text x="196" y="574" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(92,107,115)" text-anchor="middle">rewriting these units</text>
<text x="196" y="596" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(92,107,115)" text-anchor="middle">does not change KVN or min SVN</text>
<rect x="392" y="52" width="824" height="648" rx="8" fill="rgb(255,255,255)" stroke="rgb(226,221,212)"/>
<text x="412" y="88" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" fill="rgb(31,41,51)" font-weight="700">Same version check</text>
<rect x="412" y="112" width="360" height="52" rx="6" fill="rgb(255,255,255)" stroke="rgb(15,110,110)"/>
<text x="592" y="144" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">manifest KVN  &gt;  stored KVN</text>
<rect x="792" y="112" width="390" height="52" rx="6" fill="rgb(204,251,241)" stroke="rgb(15,110,110)"/>
<text x="987" y="144" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(15,110,110)" text-anchor="middle">0x31 F000 writes the new KVN</text>
<rect x="412" y="180" width="360" height="72" rx="6" fill="rgb(255,255,255)" stroke="rgb(15,110,110)"/>
<text x="592" y="208" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">header KVN  =  stored KVN</text>
<text x="592" y="232" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">header SVN  ≥  min SVN</text>
<rect x="792" y="180" width="390" height="72" rx="6" fill="rgb(204,251,241)" stroke="rgb(15,110,110)"/>
<text x="987" y="212" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(15,110,110)" text-anchor="middle">0x31 F002 writes the package SVN</text>
<text x="987" y="234" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(15,110,110)" text-anchor="middle">this routine sends no version</text>
<text x="412" y="300" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">KVN and min SVN occupy one RPMB region.</text>
<text x="412" y="328" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">UFS 2.2 and UFS 3.1 allow up to four regions.</text>
<text x="412" y="356" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">Each region has its own HMAC key and its own write counter.</text>
<text x="412" y="396" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">mmc does not open this unit.</text>
<text x="412" y="424" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">bBootLunEn selects Boot LUN A or Boot LUN B.</text>
<text x="412" y="452" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">That selection does not change KVN or min SVN.</text>
</svg>

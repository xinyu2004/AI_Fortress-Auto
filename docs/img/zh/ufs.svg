<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
<rect width="1240" height="720" fill="rgb(247,245,240)"/>
<text x="28" y="34" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" fill="rgb(31,41,51)">UFS：同一套版本检查，数记在一个 RPMB region 里</text>
<rect x="16" y="52" width="360" height="648" rx="8" fill="rgb(255,255,255)" stroke="rgb(226,221,212)"/>
<text x="36" y="80" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" fill="rgb(31,41,51)" font-weight="700">UFS</text>
<rect x="36" y="96" width="320" height="56" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="130" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">Boot LUN A</text>
<rect x="36" y="160" width="320" height="56" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="194" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">Boot LUN B</text>
<rect x="36" y="224" width="320" height="200" rx="6" fill="rgb(255,237,213)" stroke="rgb(194,65,12)" stroke-width="1.8"/>
<text x="196" y="268" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle" font-weight="700">RPMB well-known logical unit</text>
<text x="196" y="300" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle">KVN</text>
<text x="196" y="326" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(194,65,12)" text-anchor="middle">min SVN</text>
<text x="196" y="360" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(194,65,12)" text-anchor="middle">JESD220 编号 0xC4</text>
<rect x="36" y="440" width="320" height="232" rx="6" fill="rgb(255,255,255)" stroke="rgb(92,107,115)" stroke-width="1.4"/>
<text x="196" y="548" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(31,41,51)" text-anchor="middle" font-weight="700">User logical units</text>
<text x="196" y="574" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(92,107,115)" text-anchor="middle">重写这些单元</text>
<text x="196" y="596" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(92,107,115)" text-anchor="middle">不改变 KVN 和 min SVN</text>
<rect x="392" y="52" width="824" height="648" rx="8" fill="rgb(255,255,255)" stroke="rgb(226,221,212)"/>
<text x="412" y="88" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" fill="rgb(31,41,51)" font-weight="700">同一套版本检查</text>
<rect x="412" y="112" width="360" height="52" rx="6" fill="rgb(255,255,255)" stroke="rgb(15,110,110)"/>
<text x="592" y="144" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">清单 KVN  &gt;  已保存的 KVN</text>
<rect x="792" y="112" width="390" height="52" rx="6" fill="rgb(204,251,241)" stroke="rgb(15,110,110)"/>
<text x="987" y="144" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(15,110,110)" text-anchor="middle">0x31 F000 写入新的 KVN</text>
<rect x="412" y="180" width="360" height="72" rx="6" fill="rgb(255,255,255)" stroke="rgb(15,110,110)"/>
<text x="592" y="208" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">头里的 KVN  =  已保存的 KVN</text>
<text x="592" y="232" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="rgb(15,110,110)" text-anchor="middle" font-weight="700">头里的 SVN  ≥  min SVN</text>
<rect x="792" y="180" width="390" height="72" rx="6" fill="rgb(204,251,241)" stroke="rgb(15,110,110)"/>
<text x="987" y="212" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(15,110,110)" text-anchor="middle">0x31 F002 写成这个包的 SVN</text>
<text x="987" y="234" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" fill="rgb(15,110,110)" text-anchor="middle">这一帧不下发版本</text>
<text x="412" y="300" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">KVN 和 min SVN 放在一个 RPMB region。</text>
<text x="412" y="328" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">UFS 2.2 和 UFS 3.1 最多四个 region。</text>
<text x="412" y="356" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">每个 region 有自己的 HMAC 密钥和自己的写计数。</text>
<text x="412" y="396" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">mmc 打不开这个单元。</text>
<text x="412" y="424" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">bBootLunEn 选择 Boot LUN A 或 Boot LUN B。</text>
<text x="412" y="452" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="rgb(31,41,51)">这个选择不改变 KVN，也不改变 min SVN。</text>
</svg>
